name: backbeatin
base: core20
version: '0.1.0'
summary: Automatically verify that your Restic and Borg backups can actually be restored
description: |
  Backbeatin is a single-binary Rust tool that automatically and verifiably tests 
  whether existing Restic and Borg backup repositories can actually be restored. 
  It performs real restores into ephemeral Docker containers, cryptographically 
  verifies the results, and provides tamper-evident proof of each verification run.

grade: stable
confinement: strict

parts:
  backbeatin:
    plugin: rust
    source: .
    rust-channel: stable
    build-packages:
      - libssl-dev
      - pkg-config
      - curl
    stage-packages:
      - docker.io
    override-build: |
      cd crates/backbeat-cli
      cargo install --path . --root $SNAPCRAFT_PART_INSTALL
      mv $SNAPCRAFT_PART_INSTALL/bin/backbeat $SNAPCRAFT_PART_INSTALL/bin/
      rm -rf $SNAPCRAFT_PART_INSTALL/.cargo
      rm -rf $SNAPCRAFT_PART_INSTALL/lib

apps:
  backbeat:
    command: backbeat
    plugs:
      - docker
      - network
      - home
