[package]
name = "backbeatin"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eniyos/backbeatin"
homepage = "https://github.com/eniyos/backbeatin"
description = "Automatically verify that your Restic and Borg backups can actually be restored"
keywords = ["backup", "restic", "borg", "verification", "devops"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "backbeatin"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
bollard = "0.17"
futures-util = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
tokio-cron-scheduler = "0.10"

[dev-dependencies]
testcontainers = "0.23"
