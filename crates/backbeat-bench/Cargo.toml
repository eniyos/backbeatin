[package]
name = "backbeat-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
backbeat-core = { path = "../backbeat-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
bollard = "0.17"
futures-util = "0.3"
