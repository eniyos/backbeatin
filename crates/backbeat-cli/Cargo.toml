[package]
name = "backbeat-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "backbeat"
path = "src/main.rs"

[dependencies]
backbeat-core = { path = "../backbeat-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
