[package]
name = "backbeat"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eniyos/backbeatin"
homepage = "https://github.com/eniyos/backbeatin"
description = "Automatically verify that your Restic and Borg backups can actually be restored"
keywords = ["backup", "restic", "borg", "verification", "devops"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "backbeat"
path = "src/main.rs"

[dependencies]
backbeat-core = { path = "../backbeat-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
tokio-cron-scheduler = "0.10"
serde_json = "1"

[dev-dependencies]
testcontainers = "0.23"
backbeat-core = { path = "../backbeat-core" }
