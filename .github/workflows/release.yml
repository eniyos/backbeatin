name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: backbeatin-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: backbeatin-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: backbeatin-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: backbeatin-macos-aarch64

    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          tar czf "${{ github.workspace }}/${{ matrix.artifact_name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" backbeatin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  sign:
    name: Sign Release Artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten the per-artifact directories into a single staging folder so
      # SHA256SUMS and the signature cover exactly the files that ship.
      - name: Stage artifacts
        run: |
          mkdir dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;

      # The Ed25519 private key is stored as a repository secret
      # (RELEASE_SIGNING_KEY, base64-encoded PEM). Generate one with:
      #   openssl genpkey -algorithm ed25519 -out release.key.pem
      #   base64 -i release.key.pem   # store this value as the secret
      # The matching public key lives in docs/release-key.pub (see the
      # "Release verification" section of the README for distribution
      # and rotation procedure).
      - name: Generate SHA256SUMS and Ed25519 signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          printf '%s' "$RELEASE_SIGNING_KEY" | tr -d ' \n\r' | base64 -d > release.key.pem
          chmod 600 release.key.pem
          openssl pkeyutl -sign -rawin \
            -inkey release.key.pem \
            -in SHA256SUMS \
            -out SHA256SUMS.sig
          rm -f release.key.pem

      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-dist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig

  release:
    name: Create GitHub Release
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download signed bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-dist
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish npm Package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Publish the npm/bun wrapper package (its postinstall downloads the
      # platform binary from this release and verifies it against SHA256SUMS).
      # Skips silently on non-tag refs (workflow_dispatch from main) and when
      # the version is already published.
      - name: Publish to npm
        working-directory: npm/backbeatin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "Not a version tag ($GITHUB_REF_NAME) — skipping npm publish."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          if npm view "backbeatin@$VERSION" version >/dev/null 2>&1; then
            echo "backbeatin@$VERSION is already published — skipping."
          else
            npm publish --access public
          fi

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download signed bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-dist
          path: dist

      # Regenerate the tap formula with this release's checksums (parsed from
      # the signed SHA256SUMS manifest) and push it to eniyos/homebrew-backbeatin.
      # Requires the TAP_PUSH_TOKEN secret (fine-grained PAT with Contents:
      # read/write on the tap repo); skipped silently when it is not set.
      - name: Update tap formula
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$VERSION" != v* ]]; then
            echo "Not a version tag ($VERSION) — skipping tap update."
            exit 0
          fi
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN not set — skipping Homebrew tap update."
            exit 0
          fi
          V="${VERSION#v}"
          get() { awk -v f="$1" '$2==f {print $1}' dist/SHA256SUMS; }
          MAC_ARM=$(get backbeatin-macos-aarch64.tar.gz)
          MAC_X64=$(get backbeatin-macos-x86_64.tar.gz)
          LIN_ARM=$(get backbeatin-linux-aarch64.tar.gz)
          LIN_X64=$(get backbeatin-linux-x86_64.tar.gz)
          for h in "$MAC_ARM" "$MAC_X64" "$LIN_ARM" "$LIN_X64"; do
            [ -n "$h" ] || { echo "Missing checksum in SHA256SUMS"; exit 1; }
          done

          BASE="https://github.com/eniyos/backbeatin/releases/download/$VERSION"
          {
            echo '# This formula is maintained by the backbeatin release workflow.'
            echo '# https://github.com/eniyos/backbeatin'
            echo 'class Backbeatin < Formula'
            echo '  desc "Prove your Restic/Borg backups are actually restorable"'
            echo '  homepage "https://github.com/eniyos/backbeatin"'
            echo "  version \"$V\""
            echo '  license "MIT"'
            echo ''
            echo '  on_macos do'
            echo '    on_arm do'
            echo "      url \"$BASE/backbeatin-macos-aarch64.tar.gz\""
            echo "      sha256 \"$MAC_ARM\""
            echo '    end'
            echo '    on_intel do'
            echo "      url \"$BASE/backbeatin-macos-x86_64.tar.gz\""
            echo "      sha256 \"$MAC_X64\""
            echo '    end'
            echo '  end'
            echo ''
            echo '  on_linux do'
            echo '    on_arm do'
            echo "      url \"$BASE/backbeatin-linux-aarch64.tar.gz\""
            echo "      sha256 \"$LIN_ARM\""
            echo '    end'
            echo '    on_intel do'
            echo "      url \"$BASE/backbeatin-linux-x86_64.tar.gz\""
            echo "      sha256 \"$LIN_X64\""
            echo '    end'
            echo '  end'
            echo ''
            echo '  def install'
            echo '    bin.install "backbeatin"'
            echo '  end'
            echo ''
            echo '  test do'
            echo '    assert_match "backbeatin", shell_output("#{bin}/backbeatin --help")'
            echo '  end'
            echo 'end'
          } > backbeatin.rb

          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/eniyos/homebrew-backbeatin.git" tap
          cp backbeatin.rb tap/Formula/backbeatin.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula already up to date."
          else
            git commit -am "Formula: backbeatin $V"
            git push
          fi
